name: Verificação

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: mvn --batch-mode verify
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: |
          mkdir -p data
          DB_PATH=./data/ci.db java -jar target/organizador-candidaturas-1.0.0.jar > app.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/resumo; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8080/api/resumo
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostico
          path: |
            app.log
            test-results/
            target/surefire-reports/
